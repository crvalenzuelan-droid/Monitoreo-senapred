name: Diagnostico MeteoChile Temperaturas

'on':
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repositorio-alertas-gobierno
  cancel-in-progress: false

jobs:
  diagnostico-temperatura:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Validar diagnosticos
        shell: bash
        run: |
          python -m py_compile meteochile_temperatura/diagnostico_temperatura.py
          python -m py_compile meteochile_temperatura/diagnostico_scripts_temperatura.py

      - name: Ejecutar diagnostico principal
        shell: bash
        run: python meteochile_temperatura/diagnostico_temperatura.py

      - name: Descargar y analizar scripts
        shell: bash
        run: python meteochile_temperatura/diagnostico_scripts_temperatura.py

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: |
          find meteochile_temperatura -type d -name '__pycache__' -exec rm -rf '{}' + || true
          find meteochile_temperatura -type f -name '*.pyc' -delete || true

      - name: Verificar resultados
        if: always()
        shell: bash
        run: |
          ls -la meteochile_temperatura
          test -f meteochile_temperatura/resultado_descarga_scripts.json && cat meteochile_temperatura/resultado_descarga_scripts.json || true
          test -f meteochile_temperatura/hallazgos_scripts_temperatura.txt && head -n 300 meteochile_temperatura/hallazgos_scripts_temperatura.txt || true

      - name: Guardar resultados en GitHub
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f meteochile_temperatura/ || true
          git status --short

          if git diff --cached --quiet; then
            echo 'No hay resultados nuevos para guardar.'
            exit 0
          fi

          git commit -m 'Actualizar diagnostico MeteoChile temperaturas'
          git pull --rebase origin main
          git push origin main

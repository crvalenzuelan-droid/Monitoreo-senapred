name: Pronostico WeatherAPI Chile

on:
  workflow_dispatch:
  schedule:
    - cron: "0,20,40 10-12 * * *"

permissions:
  contents: write

concurrency:
  group: pronostico-weatherapi-chile
  cancel-in-progress: false

jobs:
  generar-pronostico:
    name: Generar pronostico
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar horario de Chile
        id: horario_chile
        shell: bash
        run: |
          HORA_CHILE=$(TZ=America/Santiago date +%H)
          FECHA_CHILE=$(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')

          echo "Fecha y hora en Chile: $FECHA_CHILE"
          echo "Tipo de ejecucion: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "Ejecucion manual autorizada."
          elif [ "$HORA_CHILE" = "07" ] || [ "$HORA_CHILE" = "08" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "Horario automatico autorizado."
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            echo "Ejecucion omitida por horario."
          fi

      - name: Configurar Python
        if: steps.horario_chile.outputs.ejecutar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar secreto WeatherAPI
        if: steps.horario_chile.outputs.ejecutar == 'true'
        shell: bash
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: |
          if [ -z "$WEATHERAPI_KEY" ]; then
            echo "ERROR: no existe el secreto WEATHERAPI_KEY."
            exit 1
          fi

          echo "El secreto WEATHERAPI_KEY existe."

      - name: Validar scraper
        if: steps.horario_chile.outputs.ejecutar == 'true'
        shell: bash
        run: |
          if [ ! -s "weatherapi_chile/scraper_weatherapi.py" ]; then
            echo "ERROR: no existe weatherapi_chile/scraper_weatherapi.py"
            exit 1
          fi

          python -m py_compile weatherapi_chile/scraper_weatherapi.py
          echo "Sintaxis del scraper correcta."

      - name: Ejecutar pronostico WeatherAPI
        if: steps.horario_chile.outputs.ejecutar == 'true'
        shell: bash
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: |
          python weatherapi_chile/scraper_weatherapi.py

      - name: Verificar archivos generados
        if: steps.horario_chile.outputs.ejecutar == 'true'
        shell: bash
        run: |
          ARCHIVOS=(
            "weatherapi_chile/estado_weatherapi.json"
            "weatherapi_chile/pronostico_weatherapi_chile.json"
            "weatherapi_chile/pronostico_uv_weatherapi.json"
            "weatherapi_chile/pronostico_uv_weatherapi.xml"
            "weatherapi_chile/pronostico_temperaturas_weatherapi.json"
            "weatherapi_chile/pronostico_temperaturas_weatherapi.xml"
          )

          for ARCHIVO in "${ARCHIVOS[@]}"; do
            if [ ! -s "$ARCHIVO" ]; then
              echo "ERROR: archivo inexistente o vacio: $ARCHIVO"
              exit 1
            fi

            echo "OK: $ARCHIVO"
          done

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          ruta = Path("weatherapi_chile/estado_weatherapi.json")

          with ruta.open("r", encoding="utf-8") as archivo:
              estado = json.load(archivo)

          if estado.get("estado") != "OK":
              print("ERROR: el estado no es OK.")
              print(json.dumps(estado, ensure_ascii=False, indent=2))
              sys.exit(1)

          if estado.get("cantidad_regiones") != 16:
              print(
                  "ERROR: se esperaban 16 regiones y se obtuvieron "
                  f"{estado.get('cantidad_regiones')}"
              )
              sys.exit(1)

          if estado.get("errores"):
              print("ERROR: existen errores regionales.")
              print(json.dumps(estado["errores"], ensure_ascii=False, indent=2))
              sys.exit(1)

          print("Estado validado correctamente.")
          print("Regiones procesadas: 16")
          PY

      - name: Guardar pronosticos en GitHub
        if: steps.horario_chile.outputs.ejecutar == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weatherapi_chile/estado_weatherapi.json
          git add weatherapi_chile/pronostico_weatherapi_chile.json
          git add weatherapi_chile/pronostico_uv_weatherapi.json
          git add weatherapi_chile/pronostico_uv_weatherapi.xml
          git add weatherapi_chile/pronostico_temperaturas_weatherapi.json
          git add weatherapi_chile/pronostico_temperaturas_weatherapi.xml

          if git diff --cached --quiet; then
            echo "No existen cambios nuevos para guardar."
            exit 0
          fi

          git commit -m "Actualizar pronosticos WeatherAPI Chile"

          for INTENTO in 1 2 3; do
            echo "Intento de publicacion $INTENTO de 3"

            if git push; then
              echo "Pronosticos publicados correctamente."
              exit 0
            fi

            if [ "$INTENTO" -lt 3 ]; then
              echo "Reintentando publicacion..."
              git pull --rebase origin main
              sleep 5
            fi
          done

          echo "ERROR: no fue posible publicar los cambios."
          exit 1

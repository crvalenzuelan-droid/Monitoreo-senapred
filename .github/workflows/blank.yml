name: Monitor SENAPRED

on:
  workflow_dispatch:

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-senapred
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Validar sintaxis del scraper
        shell: bash
        run: |
          python -m py_compile scraper.py

      - name: Ejecutar scraper
        shell: bash
        env:
          TZ: America/Santiago
        run: |
          python scraper.py

      - name: Verificar archivos generados
        shell: bash
        run: |
          echo "Revisando archivos SENAPRED..."

          test -s rss.xml
          test -s alertas.json
          test -s portada_senapred.txt

          echo ""
          echo "Estado de los archivos:"
          ls -lh rss.xml alertas.json portada_senapred.txt

          echo ""
          echo "Primeras lineas del RSS:"
          head -n 30 rss.xml

          echo ""
          echo "Primeras lineas del JSON:"
          head -n 40 alertas.json

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: |
          find . -type d -name "__pycache__" -exec rm -rf "{}" + || true
          find . -type f -name "*.pyc" -delete || true

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f rss.xml
          git add -f alertas.json
          git add -f portada_senapred.txt

          echo "Cambios detectados:"
          git status --short

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar RSS SENAPRED"

          for intento in 1 2 3; do
            echo "Intento ${intento} de 3."

            if git pull --rebase origin main && git push origin main; then
              echo "Cambios enviados correctamente."
              exit 0
            fi

            echo "Intento ${intento} fallido."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

          echo "No fue posible enviar los cambios despues de 3 intentos."
          exit 1

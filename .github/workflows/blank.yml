name: Generar JSON SENAPRED

on:
  workflow_dispatch:

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Crear JSON de prueba
        run: |
          cat > alertas.json << EOF
          {
            "titulo": "Prueba SENAPRED",
            "fecha": "2026-09-14",
            "region": "Maule",
            "tipo": "Alerta Amarilla"
          }
          EOF

      - name: Mostrar JSON
        run: cat alertas.json

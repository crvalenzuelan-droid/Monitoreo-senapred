name: Generar JSON SENAPRED

on:
  workflow_dispatch:

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear JSON
        run: |
          cat > alertas.json << EOF
          {
            "titulo": "Prueba SENAPRED",
            "fecha": "2026-09-14",
            "region": "Maule",
            "tipo": "Alerta Amarilla"
          }
          EOF

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: alertas-json
          path: alertas.json


name: Monitor SENAPRED

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: repositorio-alertas-gobierno
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Ejecutar scraper
        run: |
          python scraper.py

      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add rss.xml alertas.json portada_senapred.txt

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar RSS SENAPRED"

            git pull --rebase origin main

            for intento in 1 2 3
            do
              if git push origin main; then
                echo "Cambios enviados correctamente."
                break
              fi

              echo "Push rechazado. Actualizando repositorio. Intento $intento de 3."
              git pull --rebase origin main
              sleep 5

              if [ "$intento" -eq 3 ]; then
                echo "No fue posible enviar los cambios después de 3 intentos."
                exit 1
              fi
            done
          fi

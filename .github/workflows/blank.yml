name: Generar JSON SENAPRED 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Crear JSON
        run: |
          cat > alertas.json << EOF
          {
            "titulo": "Prueba SENAPRED",
            "fecha": "2026-09-14",
            "region": "Maule",
            "tipo": "Alerta Amarilla"
          }
          EOF

      - name: Guardar JSON en repositorio
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add alertas.json
          git commit -m "Actualizar alertas.json" || echo "Sin cambios"
          git push
`

name: Monitor SENAPRED

'on':
  workflow_dispatch: {}

  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: repositorio-alertas-gobierno
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Validar sintaxis del scraper
        shell: bash
        run: |
          python -m py_compile scraper.py

      - name: Ejecutar scraper
        shell: bash
        run: |
          python scraper.py

      - name: Verificar archivos generados
        shell: bash
        run: |
          echo "Revisando archivos SENAPRED..."

          test -f rss.xml
          test -f alertas.json
          test -f portada_senapred.txt

          echo ""
          echo "Estado de los archivos:"
          ls -lh rss.xml alertas.json portada_senapred.txt

          echo ""
          echo "Primeras lineas del RSS:"
          head -n 30 rss.xml

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml alertas.json portada_senapred.txt

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualizar RSS SENAPRED"

          for intento in 1 2 3
          do
            echo "Intento de envio $intento de 3."

            git pull --rebase origin main

            if git push origin main; then
              echo "Cambios enviados correctamente."
              exit 0
            fi

            echo "Push rechazado. Se intentara nuevamente."
            sleep 5
          done

          echo "No fue posible enviar los cambios despues de 3 intentos."
          exit 1

name: Pronostico Temperaturas Chile

on:
  workflow_dispatch:

  schedule:
    - cron: "10 10 * * *"
    - cron: "40 10 * * *"

permissions:
  contents: write

concurrency:
  group: pronostico-temperaturas-chile
  cancel-in-progress: false

jobs:
  pronostico-temperaturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Validar sintaxis del scraper
        shell: bash
        run: |
          python -m py_compile meteochile_temperatura/scraper_temperaturas.py

      - name: Ejecutar scraper de temperaturas
        shell: bash
        env:
          TZ: America/Santiago
        run: |
          python meteochile_temperatura/scraper_temperaturas.py

      - name: Verificar archivos generados
        shell: bash
        run: |
          echo "Archivos de temperatura:"
          ls -la meteochile_temperatura

          echo ""
          echo "Verificando JSON:"
          test -s meteochile_temperatura/pronostico_temperaturas.json

          echo ""
          echo "Verificando XML:"
          test -s meteochile_temperatura/pronostico_temperaturas.xml

          echo ""
          echo "Primeras lineas del JSON:"
          head -n 50 meteochile_temperatura/pronostico_temperaturas.json

          echo ""
          echo "Primeras lineas del XML:"
          head -n 80 meteochile_temperatura/pronostico_temperaturas.xml

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: |
          find meteochile_temperatura -type d -name "__pycache__" -exec rm -rf "{}" + || true
          find meteochile_temperatura -type f -name "*.pyc" -delete || true

      - name: Guardar pronostico en GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f meteochile_temperatura/pronostico_temperaturas.json
          git add -f meteochile_temperatura/pronostico_temperaturas.xml

          git status --short

          if git diff --cached --quiet; then
            echo "No hay cambios en el pronostico de temperaturas."
            exit 0
          fi

          git commit -m "Actualizar pronostico de temperaturas"

          for intento in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pronostico guardado correctamente."
              exit 0
            fi

            echo "Intento ${intento} fallido. Reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

          echo "No fue posible guardar el pronostico despues de 3 intentos."
          exit 1
